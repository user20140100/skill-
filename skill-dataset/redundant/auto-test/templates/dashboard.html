<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>auto-test 测试看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #2d3436; padding: 24px; line-height: 1.6; }
h1 { font-size: 24px; font-weight: 700; color: #6c5ce7; margin-bottom: 8px; }
.subtitle { color: #636e72; font-size: 13px; margin-bottom: 24px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
.card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
.card .value { font-size: 32px; font-weight: 700; }
.card .label { font-size: 12px; color: #636e72; margin-top: 4px; }
.card.passed .value { color: #00b894; }
.card.failed .value { color: #d63031; }
.card.fixmed .value { color: #fdcb6e; }
.card.escalated .value { color: #e17055; }
.card.rate .value { color: #6c5ce7; }
.section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.section h2 { font-size: 16px; font-weight: 600; color: #2d3436; margin-bottom: 16px; }
svg.trend-chart { width: 100%; max-height: 240px; overflow: visible; }
.chart-line { fill: none; stroke: #6c5ce7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.chart-area { fill: url(#areaGrad); }
.chart-dot { fill: #6c5ce7; }
.chart-label { font-size: 11px; fill: #636e72; }
.chart-grid { stroke: #dfe6e9; stroke-width: 0.5; }
.coverage-bar { height: 24px; border-radius: 4px; background: #dfe6e9; overflow: hidden; margin-bottom: 4px; position: relative; }
.coverage-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.coverage-fill.high { background: linear-gradient(90deg, #00b894, #55efc4); }
.coverage-fill.mid { background: linear-gradient(90deg, #fdcb6e, #ffeaa7); }
.coverage-fill.low { background: linear-gradient(90deg, #d63031, #ff7675); }
.module-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.module-name { width: 140px; font-size: 13px; font-weight: 500; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.module-bar { flex: 1; }
.module-stats { font-size: 11px; color: #636e72; width: 120px; text-align: right; flex-shrink: 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #dfe6e9; color: #636e72; font-weight: 600; }
td { padding: 8px 12px; border-bottom: 1px solid #f1f2f6; }
tr:hover td { background: #f8f9ff; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge.flaky { background: #ffeaa7; color: #d68910; }
.badge.fail { background: #fab1a0; color: #c0392b; }
.empty { text-align: center; color: #b2bec3; padding: 32px; font-size: 14px; }
</style>
</head>
<body>
<h1>auto-test 测试看板</h1>
<p class="subtitle" id="genTime">加载中...</p>

<div class="cards" id="cards"></div>

<div class="section">
  <h2>通过率趋势</h2>
  <div id="trendChart"></div>
</div>

<div class="section">
  <h2>模块覆盖率</h2>
  <div id="coverage"></div>
</div>

<div class="section">
  <h2>失败 Top-10</h2>
  <div id="failTop"></div>
</div>

<div class="section">
  <h2>Flaky 检测</h2>
  <div id="flakyList"></div>
</div>

<script>
(async function() {
  let data;
  try {
    if (window.__DASHBOARD_DATA__) {
      data = window.__DASHBOARD_DATA__;
    } else {
      const resp = await fetch('./history.json');
      data = await resp.json();
    }
  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="empty">无法加载 history.json，请先运行 report_gen.mjs 生成数据</div>';
    return;
  }

  if (data.error) {
    document.getElementById('cards').innerHTML = `<div class="empty">${data.message}</div>`;
    return;
  }

  document.getElementById('genTime').textContent = `生成时间：${new Date(data.generatedAt).toLocaleString('zh-CN')}`;

  // Cards
  const last = data.runHistory[data.runHistory.length - 1];
  document.getElementById('cards').innerHTML = `
    <div class="card rate"><div class="value">${(last.passRate * 100).toFixed(1)}%</div><div class="label">通过率</div></div>
    <div class="card passed"><div class="value">${last.passedCount}</div><div class="label">通过</div></div>
    <div class="card failed"><div class="value">${last.failedCount}</div><div class="label">失败</div></div>
    <div class="card fixmed"><div class="value">${last.fixmedCount}</div><div class="label">Fixme</div></div>
    <div class="card escalated"><div class="value">${last.escalatedCount}</div><div class="label">升级</div></div>
  `;

  // Trend chart
  renderTrend(data.runHistory);

  // Coverage
  renderCoverage(data.moduleCoverage);

  // Fail Top
  renderFailTop(data.failTopN);

  // Flaky
  renderFlaky(data.flaky);
})();

function renderTrend(history) {
  const W = 700, H = 200, PAD = 40;
  const n = history.length;
  if (n < 2) {
    document.getElementById('trendChart').innerHTML = '<div class="empty">需要至少 2 次运行数据才能绘制趋势</div>';
    return;
  }

  const xStep = (W - PAD * 2) / (n - 1);
  const points = history.map((r, i) => ({
    x: PAD + i * xStep,
    y: PAD + (1 - r.passRate) * (H - PAD * 2),
    rate: r.passRate,
    runId: r.runId,
  }));

  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
  const areaD = pathD + ` L ${points[n-1].x} ${H - PAD} L ${points[0].x} ${H - PAD} Z`;

  let gridLines = '';
  for (let pct = 0; pct <= 100; pct += 25) {
    const y = PAD + (1 - pct / 100) * (H - PAD * 2);
    gridLines += `<line x1="${PAD}" y1="${y}" x2="${W - PAD}" y2="${y}" class="chart-grid"/>`;
    gridLines += `<text x="${PAD - 8}" y="${y + 4}" class="chart-label" text-anchor="end">${pct}%</text>`;
  }

  let dots = points.map(p =>
    `<circle cx="${p.x}" cy="${p.y}" r="4" class="chart-dot"><title>${p.runId}: ${(p.rate*100).toFixed(1)}%</title></circle>`
  ).join('');

  let labels = '';
  const labelStep = Math.max(1, Math.floor(n / 8));
  const shownSet = new Set();
  for (let i = 0; i < n; i += labelStep) shownSet.add(i);
  shownSet.add(n - 1);
  for (const i of shownSet) {
    const p = points[i];
    const d = new Date(history[i].ts * 1000);
    const label = `${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    labels += `<text x="${p.x}" y="${H - 10}" class="chart-label" text-anchor="middle">${label}</text>`;
  }

  document.getElementById('trendChart').innerHTML = `
    <svg class="trend-chart" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0.02"/>
      </linearGradient></defs>
      ${gridLines}
      <path d="${areaD}" class="chart-area"/>
      <path d="${pathD}" class="chart-line"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

function renderCoverage(modules) {
  if (!modules || modules.length === 0) {
    document.getElementById('coverage').innerHTML = '<div class="empty">暂无模块覆盖数据</div>';
    return;
  }

  modules.sort((a, b) => b.nlCount - a.nlCount);
  let html = '';
  for (const m of modules) {
    const pct = m.nlCount > 0 ? (m.lastPassCount / m.nlCount * 100) : 0;
    const cls = pct >= 80 ? 'high' : pct >= 50 ? 'mid' : 'low';
    html += `
      <div class="module-row">
        <div class="module-name" title="${m.routeKey}">${m.routeKey}</div>
        <div class="module-bar">
          <div class="coverage-bar"><div class="coverage-fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div>
        </div>
        <div class="module-stats">nl:${m.nlCount} spec:${m.specCount} pass:${m.lastPassCount}</div>
      </div>
    `;
  }
  document.getElementById('coverage').innerHTML = html;
}

function renderFailTop(failTopN) {
  if (!failTopN || failTopN.length === 0) {
    document.getElementById('failTop').innerHTML = '<div class="empty">最近无失败用例</div>';
    return;
  }
  let html = '<table><thead><tr><th>用例 ID</th><th>失败次数</th></tr></thead><tbody>';
  for (const item of failTopN) {
    html += `<tr><td>${item.caseId}</td><td><span class="badge fail">${item.count} 次</span></td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('failTop').innerHTML = html;
}

function renderFlaky(flaky) {
  if (!flaky || flaky.length === 0) {
    document.getElementById('flakyList').innerHTML = '<div class="empty">未检测到 Flaky 用例</div>';
    return;
  }
  let html = '<table><thead><tr><th>用例 ID</th><th>状态交替次数</th><th>最近状态序列</th></tr></thead><tbody>';
  for (const item of flaky) {
    const seq = item.history.slice(-6).map(s => s === 'pass' ? '✓' : s === 'fail' ? '✗' : '⚠').join(' ');
    html += `<tr><td>${item.caseId}</td><td><span class="badge flaky">${item.alternations}</span></td><td>${seq}</td></tr>`;
  }
  html += '</tbody></table>';
  document.getElementById('flakyList').innerHTML = html;
}
</script>
</body>
</html>
