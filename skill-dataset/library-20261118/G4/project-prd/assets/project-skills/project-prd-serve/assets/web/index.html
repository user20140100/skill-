<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project PRD Viewer</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">PROJECT PRD</p>
        <h1 id="project-title">项目需求基线</h1>
      </div>
      <div id="summary" class="summary">加载中…</div>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <input id="search" type="search" placeholder="搜索功能或 PRD ID" />
        <div id="tree" class="tree"></div>
      </aside>
      <article id="content" class="content">
        <div class="empty"><span class="empty-icon">✦</span><h2>选择一个 PRD</h2><p>从左侧功能树开始浏览。</p></div>
      </article>
    </main>
    <script src="./markdown.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
